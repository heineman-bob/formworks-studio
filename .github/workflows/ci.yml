name: CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install Python development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate generator configuration
        run: python -m unittest discover -s tests -q
      - name: Check Python source
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Check designer JavaScript
        run: |
          node --check app/static/app.js
          node --test tests/*.test.mjs
      - name: Install studio dependencies
        run: npm ci --prefix studio --no-audit --no-fund
      - name: Check studio formatting
        run: npm run format:check --prefix studio
      - name: Build studio
        run: |
          npm run build --prefix studio
